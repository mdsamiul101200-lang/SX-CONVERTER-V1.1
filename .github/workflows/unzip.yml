name: SX CONVERTER - Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Locate ZIP
        shell: bash
        run: |
          echo "Searching repository for ZIP..."

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "================================"
            echo "ERROR: NO ZIP FILE FOUND"
            echo "================================"
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -not -path "*/.git/*"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Test ZIP
        shell: bash
        run: |
          echo "Testing archive..."

          7z t "$ZIP_PATH"

          echo "ZIP TEST PASSED."

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/_sx_extract"

          mkdir -p "$GITHUB_WORKSPACE/_sx_extract"

          echo "Extracting ZIP..."

          7z x "$ZIP_PATH" \
            -o"$GITHUB_WORKSPACE/_sx_extract" \
            -y

          echo "Extraction completed."

      - name: Find Project
        shell: bash
        run: |
          BASE="$GITHUB_WORKSPACE/_sx_extract"

          echo "Searching for project..."

          PROJECT=""

          # Check for package.json
          PACKAGE=$(find "$BASE" \
            -type f \
            -name "package.json" \
            | head -1)

          if [ -n "$PACKAGE" ]; then
            PROJECT=$(dirname "$PACKAGE")
          fi

          # If package.json wasn't found, check index.html
          if [ -z "$PROJECT" ]; then
            INDEX=$(find "$BASE" \
              -type f \
              -name "index.html" \
              | head -1)

            if [ -n "$INDEX" ]; then
              PROJECT=$(dirname "$INDEX")
            fi
          fi

          # If still not found, use extracted root
          if [ -z "$PROJECT" ]; then
            PROJECT="$BASE"
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project location:"
          echo "$PROJECT"

      - name: Install Project Files
        shell: bash
        run: |
          echo "Copying SX CONVERTER files..."

          cp -a "$PROJECT"/. "$GITHUB_WORKSPACE"/

          echo "Removing temporary files..."

          rm -rf "$GITHUB_WORKSPACE/_sx_extract"

          rm -f "$ZIP_PATH"

          echo "Files installed."

      - name: Verify
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       SX CONVERTER V1.1"
          echo "          VERIFICATION"
          echo "======================================"

          test -f index.html && echo "OK  index.html" || echo "MISSING index.html"

          test -f package.json && echo "OK  package.json" || echo "MISSING package.json"

          test -f Dockerfile && echo "OK  Dockerfile" || echo "MISSING Dockerfile"

          test -f render.yaml && echo "OK  render.yaml" || echo "MISSING render.yaml"

          test -d server && echo "OK  server/" || echo "MISSING server/"

          test -d public && echo "OK  public/" || echo "MISSING public/"

          echo ""
          echo "Project structure:"
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "======================================"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Install SX CONVERTER V1.1 project"

          git push origin HEAD:main

          echo "================================"
          echo "SX CONVERTER INSTALLED SUCCESSFULLY"
          echo "================================"
