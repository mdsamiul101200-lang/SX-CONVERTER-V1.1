name: Unzip SX Converter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    name: Extract Project ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find ZIP File
        shell: bash
        run: |
          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . -type f \
            \( -iname "*.zip" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found in repository."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f -not -path "./.git/*"
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Check ZIP
        shell: bash
        run: |
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo "✅ ZIP file is valid."

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "✅ Extraction completed."

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f | head -100

      - name: Detect Project Root
        shell: bash
        run: |
          BASE="$GITHUB_WORKSPACE/extracted"

          PROJECT_ROOT=""

          # Check root first
          if [ -f "$BASE/package.json" ] || [ -f "$BASE/index.html" ]; then
            PROJECT_ROOT="$BASE"
          else
            # Look for package.json
            FOUND=$(find "$BASE" -type f -name "package.json" | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_ROOT=$(dirname "$FOUND")
            else
              # Look for index.html
              FOUND=$(find "$BASE" -type f -name "index.html" | head -n 1)

              if [ -n "$FOUND" ]; then
                PROJECT_ROOT=$(dirname "$FOUND")
              fi
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "❌ Could not detect SX Converter project root."
            echo ""
            echo "Extracted structure:"
            find "$BASE" -maxdepth 5 -type f
            exit 1
          fi

          echo "✅ Project root detected:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Copy Project To Repository
        shell: bash
        run: |
          echo "Copying project files..."

          # Copy everything except Git metadata
          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

          # Remove temporary extraction directory
          rm -rf "$GITHUB_WORKSPACE/extracted"

          # Remove uploaded ZIP
          rm -f "$ZIP_FILE"

          echo "✅ Project copied to repository root."

      - name: Verify SX Converter
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "     SX CONVERTER VERIFICATION"
          echo "======================================"

          if [ -f "index.html" ]; then
            echo "✅ index.html"
          else
            echo "⚠️ index.html not found"
          fi

          if [ -f "package.json" ]; then
            echo "✅ package.json"
          else
            echo "⚠️ package.json not found"
          fi

          if [ -f "Dockerfile" ]; then
            echo "✅ Dockerfile"
          else
            echo "⚠️ Dockerfile not found"
          fi

          if [ -d "server" ]; then
            echo "✅ server/"
          else
            echo "⚠️ server/ not found"
          fi

          if [ -d "public" ]; then
            echo "✅ public/"
          else
            echo "⚠️ public/ not found"
          fi

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            | sort

          echo "======================================"

      - name: Commit And Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
            exit 0
          fi

          git commit -m "Extract SX Converter project"

          git push

          echo "✅ SX Converter project successfully pushed."
