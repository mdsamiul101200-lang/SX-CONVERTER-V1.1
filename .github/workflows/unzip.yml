name: Unzip SX CONVERTER ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip SX-CONVERTER-GITHUB-READY.zip
        run: |
          mkdir -p extract
          unzip -o "SX-CONVERTER-GITHUB-READY.zip" -d extract

          if [ -d "extract/SX-CONVERTER-GITHUB-READY" ]; then
            cp -a extract/SX-CONVERTER-GITHUB-READY/. .
          else
            cp -a extract/. .
          fi

          rm -rf extract
          rm -f "SX-CONVERTER-GITHUB-READY.zip"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip SX CONVERTER project" || exit 0
          git push
